import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.jetbrains.qodana' version '2026.2.2'
}

group = 'com.musiclibrary'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Look & Feel & Icons (Dark Mode / Light Mode)
    implementation 'com.formdev:flatlaf:3.4.1'
    implementation 'com.formdev:flatlaf-extras:3.4.1'

    // MP3 Audio Playback
    implementation 'javazoom:jlayer:1.0.1'

    // VLCJ Audio Playback Engine (FLAC, MP3, AAC, ALAC, WAV, OGG, WASAPI)
    implementation 'uk.co.caprica:vlcj:4.8.3'
    implementation 'uk.co.caprica:vlcj-natives:4.8.3'

    // ID3 Tag Extraction & Editing
    implementation 'com.mpatric:mp3agic:0.9.1'

    // JSON Persistence
    implementation 'com.google.code.gson:gson:2.10.1'

    // Utilities
    implementation 'commons-io:commons-io:2.15.1'

    // SQLite Database
    implementation 'org.xerial:sqlite-jdbc:3.45.2.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

application {
    mainClass = 'com.musiclibrary.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:all" << "-Xmaxwarns" << "1000"
}

spotless {
    lineEndings 'UNIX'
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = false
    effort = Effort.valueOf('DEFAULT')
    reportLevel = Confidence.valueOf('MEDIUM')
    excludeFilter = file("config/spotbugs/exclude.xml")
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.html")
        }
        xml.required = false
    }
}

spotbugsTest {
    ignoreFailures = true
    reports {
        html.required = true
        xml.required = false
    }
}

test {
    useJUnitPlatform()
    systemProperty 'musiclibrary.storage.path', "${layout.buildDirectory.get().asFile}/tmp/test_library.json"
    systemProperty 'musiclibrary.db.path', "${layout.buildDirectory.get().asFile}/tmp/test_library.db"
}
